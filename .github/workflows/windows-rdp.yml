name: WINDOWS RDP - CLOUDFLARE TEMP
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Set"

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 STARTING CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""
          Start-Job -Name "Tunnel" -ScriptBlock { cloudflared tunnel --url tcp://localhost:3389 }
          Start-Sleep -Seconds 5
          Write-Host "📡 Capturing tunnel URL..."
          $url = (Get-Job -Name "Tunnel" | Receive-Job -Keep) -match 'https://[a-z0-9-]+\.trycloudflare\.com'
          if ($url) {
            Write-Host ""
            Write-Host "🔗 CONNECT HERE: $url"
            Write-Host ""
          } else {
            Write-Host "⚠️ URL not found in output, waiting longer..."
            Start-Sleep -Seconds 10
            $url = (Get-Job -Name "Tunnel" | Receive-Job -Keep) -match 'https://[a-z0-9-]+\.trycloudflare\.com'
            if ($url) {
              Write-Host ""
              Write-Host "🔗 CONNECT HERE: $url"
              Write-Host ""
            }
          }
          Write-Host "============================================"
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "   OS: Windows Server 2022"
          Write-Host "   CPU: 4 cores"
          Write-Host "   RAM: 16GB"
          Write-Host "============================================"

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Keeping session alive..."
          while ($true) {
            $job = Get-Job -Name "Tunnel" -ErrorAction SilentlyContinue
            if ($job -eq $null -or $job.State -eq 'Stopped') {
              Write-Host "⚠️ Tunnel stopped! Restarting..."
              Start-Job -Name "Tunnel" -ScriptBlock { cloudflared tunnel --url tcp://localhost:3389 }
            }
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
