name: WINDOWS RDP - CLOUDFLARE TEMP
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Set"

      - name: Start Cloudflare Tunnel
        run: |
          New-Item -ItemType Directory -Force -Path "C:\tmp" | Out-Null
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""
          Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardOutput "C:\tmp\tunnel.log" -RedirectStandardError "C:\tmp\tunnel.err"
          Write-Host "✅ Tunnel process started (PID: $($process.Id)). Waiting for connection..."
          Start-Sleep -Seconds 10
          Write-Host ""
          Write-Host "📡 Tunnel Log Output:"
          Get-Content "C:\tmp\tunnel.log" -ErrorAction SilentlyContinue
          Write-Host ""
          Write-Host "📡 Tunnel Error Output (if any):"
          Get-Content "C:\tmp\tunnel.err" -ErrorAction SilentlyContinue
          Write-Host ""
          Write-Host "✅ TUNNEL STARTED!"
          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "   OS: Windows Server 2022"
          Write-Host "   CPU: 4 cores"
          Write-Host "   RAM: 16GB"
          Write-Host "============================================"

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) {
            $tunnel = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
            if ($tunnel -eq $null) {
              Write-Host "⚠️ Tunnel process not found! Restarting..."
              Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardOutput "C:\tmp\tunnel.log" -RedirectStandardError "C:\tmp\tunnel.err"
              Start-Sleep -Seconds 10
            }
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
